<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroAI | Panel Forense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configuración para extraer los colores exactos de tu logo -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        agro: {
                            green: '#65B741', // Verde brillante de las hojas
                            dark: '#383838',  // Gris oscuro de la tipografía
                            brown: '#5D4037'  // Café de las raíces digitales
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-agro-dark p-6 font-sans">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-10 border-b border-gray-200 pb-4">
            <!-- Sección del Logo -->
            <div class="flex items-center">
                <!-- Asegúrate de que la ruta de la imagen sea correcta -->
                <img src="logo.jpeg" alt="AgroAI Logo" class="h-16 object-contain">
                <h1 class="text-2xl font-light text-gray-400 border-l-2 border-gray-300 pl-4 ml-4">
                    Panel <span class="font-bold text-agro-dark">Forense</span>
                </h1>
            </div>
            
            <button onclick="cargarLogs()" class="bg-agro-green hover:bg-green-600 text-white px-5 py-2.5 rounded-lg shadow-md transition-all font-semibold flex items-center gap-2">
                Actualizar Evidencia
            </button>
        </header>

        <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-100 text-gray-500 text-xs uppercase tracking-wider">
                    <tr>
                        <th class="px-6 py-5 font-bold">Evento</th>
                        <th class="px-6 py-5 font-bold">Estado</th>
                        <th class="px-6 py-5 font-bold">Usuario</th>
                        <th class="px-6 py-5 font-bold">IP</th>
                        <th class="px-6 py-5 font-bold">Firma Digital (SHA-256)</th>
                    </tr>
                </thead>
                <tbody id="tabla-logs" class="divide-y divide-gray-100">
                    <!-- Los datos aparecerán aquí -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function cargarLogs() {
            const lista = document.getElementById('tabla-logs');
            lista.innerHTML = '<tr><td colspan="5" class="text-center py-10 text-gray-400">Cargando registros forenses...</td></tr>';
            
            try {
                const res = await fetch('/api/logs');
                const logs = await res.json();
                
                if(logs.length === 0) {
                    lista.innerHTML = '<tr><td colspan="5" class="text-center py-10 text-gray-400">No hay registros forenses disponibles.</td></tr>';
                    return;
                }

                lista.innerHTML = logs.map(log => `
                    <tr class="hover:bg-gray-50 transition duration-150 text-sm">
                        <td class="px-6 py-4 font-mono font-bold text-agro-green">${log.evento}</td>
                        <td class="px-6 py-4">
                            <span class="px-3 py-1 rounded-full text-xs font-bold shadow-sm ${log.resultado === 'EXITO' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                                ${log.resultado}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-gray-500 font-medium">${log.usuario_id || 'DESCONOCIDO'}</td>
                        <td class="px-6 py-4 text-gray-500">${log.ip_origen}</td>
                        <td class="px-6 py-4">
                            <code class="text-[10px] bg-gray-100 border border-gray-200 p-2 rounded text-gray-500 break-all block w-full max-w-[280px]">
                                ${log.firma_digital}
                            </code>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Error cargando logs:', error);
                lista.innerHTML = '<tr><td colspan="5" class="text-center py-10 text-red-500 font-bold">Error al conectar con la base de datos MongoDB.</td></tr>';
            }
        }

        // Carga inicial
        cargarLogs();
    </script>
</body>
</html>
